# Optional fragment for the EXISTING site's server { ... } in 1Panel.
# Keep the listen, server_name, root, SSL and ACME settings generated by 1Panel.
# If a location below already exists, edit that location instead of adding a duplicate.

charset utf-8;
index index.html;

# Fixed filenames are revalidated, so deployments are not stuck on stale scripts.
# Do not add long-lived immutable caching to this demo's unversioned assets.
location = /index.html {
    add_header Cache-Control "no-cache" always;
}

location ~* \.(?:js|css)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
}

# This game has no history-based routes. Missing files must return an actual 404.
location / {
    try_files $uri $uri/ =404;
}
